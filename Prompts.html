<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Промпты для картинок</title>
<style>
:root{--bg:#15151c;--card:#1f1f29;--card2:#272734;--fg:#e8e6f0;--dim:#9a98a8;--acc:#9d8cff;--line:#2f2f3d;--ok:#5fd39a}
@media (prefers-color-scheme:light){:root{--bg:#f4f3f8;--card:#fff;--card2:#f0eef7;--fg:#1d1c24;--dim:#6b6978;--acc:#6a55e0;--line:#e2e0ea;--ok:#1f9d63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.pals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:12px}
.pal.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sw{display:flex;border-radius:10px;overflow:hidden;height:16px}.sw i{width:8px;display:block}
#done{margin-left:auto;background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 6px}
#done:hover{color:var(--fg)}
main{padding:2px 16px 40px;max-width:1400px}
h2{font-size:15px;margin:20px 0 8px;color:var(--dim);font-weight:600}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
details>summary h2{display:inline-block}details>summary h2:before{content:"+ ";color:var(--acc)}details[open]>summary h2:before{content:"- "}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.c b{font-size:14px}
.meta{color:var(--dim);font-size:12px}
.p{background:var(--card2);border-radius:7px;padding:7px 9px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:9.5em;overflow:auto;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap}
.c.done{opacity:.55}.c.done b:after{content:"  - готово";color:var(--ok);font-weight:400}
button.b{flex:1;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;font-size:12px}
button.b.main{flex:2;background:var(--acc);border-color:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="pals" id="pals"></div></header>
<main id="main"></main>
<div id="toast"></div>
<!-- Список того, что уже лежит в библиотеке; пересоздаётся вместе с галереей. -->
<script src="_tools/done.js"></script>
<script>
// Промпты для умной модели (понимает обычный текст, рисует на прозрачном фоне). Манера всегда - наклейка.
// «Копировать» кладёт в буфер промпт и строку «Avoid: ...». «Имена» - английские имена файлов
// (для листа 12 через запятую - вставить в поле «Имена» окна библиотеки или назвать ими файл листа).

// ---------------- палитры ----------------
var PAL = [
  ["auto","Как задумано","",[]],
  ["default","Фиолетовая ночь","lavender and periwinkle colors, soft violet, indigo shadows, white highlights",["#2b2550","#7c6cf0","#a99cff"]],
  ["dracula","Dracula","dark purple-grey base, hot pink, soft purple and cyan accents",["#282a36","#ff79c6","#bd93f9","#8be9fd"]],
  ["nord","Nord","cold arctic blue-grey, frosty light blue, snow white, muted teal",["#2e3440","#88c0d0","#eceff4"]],
  ["gruvbox","Gruvbox","warm dark brown base, mustard yellow, burnt orange, olive green",["#282828","#fabd2f","#fe8019","#98971a"]],

  ["forest","Лес","deep forest green, moss green, sage, warm amber highlights",["#1b2b22","#6a8f4e","#a3b18a","#e0a458"]],
  ["sunset","Закат","peach, coral, magenta dusk sky, deep plum shadows",["#3d1e4a","#c850c0","#ff6f61","#ffb38a"]],
  ["latte","Latte (светлая)","creamy off-white base, lavender, soft pink and peach pastels, light and airy",["#eff1f5","#7287fd","#ea76cb","#fe640b"]],
  ["solar","Solar (светлая)","warm beige base, teal, calm blue, small orange accents, light",["#fdf6e3","#2aa198","#268bd2","#cb4b16"]],
  ["paper","Бумага","off-white parchment, warm brown ink lines, faded red accents, vintage",["#f4ecd8","#5b4636","#a33b2f"]],
  ["mint","Мята","clean white, mint green, soft aqua, pale lemon accents",["#ffffff","#98f5c8","#7fdbda","#fff3a0"]],
  ["sakura","Сакура","pale pink, white blossoms, soft leaf green, warm cream",["#ffd1dc","#ffffff","#a8d5a2","#fff4e0"]],
  ["mono","Ч/б","monochrome black, white and greys, single bright red accent",["#000000","#8a8a8a","#ffffff","#e5484d"]],
  ["contrast","Контраст","pure black background, vivid yellow, pure white and cyan, high contrast",["#000000","#ffd400","#ffffff","#00e5ff"]],
  ["synthwave","Synthwave","dark purple night, hot pink and cyan neon, orange-to-pink sun gradient",["#1a0b2e","#ff2e97","#00e5ff","#ff8a00"]],
  ["ocean","Океан","abyss navy, turquoise, bioluminescent cyan glow",["#061a2b","#1fb5a8","#5ff5ff"]],
  ["autumn","Осень","burnt orange, crimson, golden yellow, dark brown",["#4a2c1a","#a93226","#d35400","#f1c40f"]]
];

// Неожиданная деталь для фонов: кнопка «С изюминкой» дописывает одну случайную.
var TW = ["a single paper lantern drifting away in the distance", "a constellation shaped like a fox in the sky", "a tiny red umbrella left on the ground",
  "one window glowing in a different color than all the others", "a paper boat floating by", "a thin trail of glowing footprints leading away",
  "a small door where no door should be", "a kite caught in the wires", "an old bicycle leaning against a wall", "a flock of paper cranes flying past",
  "a comet crossing the sky", "a cat silhouette on a far rooftop", "a forgotten telescope pointed at the sky", "a staircase that leads nowhere",
  "a message in a bottle washed ashore", "a hot air balloon far away", "a single blooming flower in an unexpected place", "a swing hanging from a lone branch"];

// ---------------- куски промптов ----------------
// Модель сильная: понимает длинный текст, держит порядок предметов, пишет надписи (и по-русски) и
// рисует мелкие детали. Поэтому промпты описывают результат точно, а надписи разрешены там, где они
// нужны (наклейки с подписью, ярлыки, обложки, схемы); в остальных - запрещены, чтобы модель не
// подписывала каждый предмет сама.
var STYLE = "Style: die-cut sticker art with one thick clean white outline around the whole sticker, soft cel shading, glossy highlights, crisp vector-like edges, gentle light from the top left, consistent line weight and lighting across the set, rich but harmonious detail";
var CLEAR = "Background: fully transparent (PNG with alpha channel), no backdrop, no ground shadow. If transparency is impossible, use one flat solid dark grey #30303a with no texture or gradient - it is removed automatically";
var COL = "Color palette: {P}";
var GRID12 = "arranged in a neat 4x3 grid with wide even gaps; every sticker is separate, not touching, centered in its cell, about the same size and drawn in the same style";
var NOLABEL = "No labels, numbers or captions under the stickers";
// Маскот описан по первым рисункам (03 Маскоты/Из проектов): гладкий пушистый комок с маленьким хохолком.
// «Messy fluffy hair» раньше превращало хохолок в шапку волос - отсюда «a little tuft, never a mop».
var MASCOT = "a cute round blob mascot: a soft lavender-periwinkle body shaped like a chubby teardrop, slightly wider at the bottom, with a fine fuzzy plush texture; a small soft tuft of three rounded fluffy points on top of the head (a little tuft, never a big mop of hair); huge glossy dark navy eyes with star-shaped sparkle highlights; pink oval blush on the cheeks; a tiny open smile; short stubby arms and tiny round feet";
var REF = "If a reference image of the mascot is attached, match its design exactly - the reference wins over this description";
var SAME = "Keep the mascot identical in every image: same body shape, tuft, eyes, proportions and colors";
var LETTER = "Lettering: Russian, in Cyrillic, spelled exactly as given in the quotes, with no other words anywhere; a bold rounded hand-lettered font with a dark outline and a soft highlight, easy to read at small size";
function slug(s, n) {
  var STOP = " a an the of with and in on at to for from by under over near into its is no very that ";
  var w = s.toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(" ").filter(function (x) { return x && STOP.indexOf(" " + x + " ") < 0; });
  return w.slice(0, n || 3).join("-");
}
function join() { return Array.prototype.slice.call(arguments).filter(Boolean).join(". ") + "."; }
// Каждый конструктор возвращает {p: промпт, n: имена файлов через запятую, k: вид, r: раздел библиотеки}.
function sheet(items, extra) {
  return { k: "sheet", r: "ic", n: items.map(function (x) { return slug(x, 3); }).join(", "), p: join(
    "A sticker sheet of 12 different objects " + GRID12,
    "Objects, in this exact order, left to right and top to bottom: " + items.join(", "),
    "Each object is a charming, slightly chunky illustration with rounded forms, small tasteful material details (metal, wood, glass, paper or fabric where it fits) and a clear silhouette that reads at 32 pixels; they are plain things without faces",
    extra, NOLABEL, STYLE, COL, CLEAR) };
}
function zoo(items, extra) {
  return { k: "sheet", r: "st", n: items.map(function (x) { return slug(x, 3); }).join(", "), p: join(
    "A sticker sheet of 12 different cute creatures " + GRID12,
    "Creatures, in this exact order: " + items.join(", "),
    "Each one has a friendly expressive face with big shiny eyes and a little blush, a lively individual pose and small details that show its character (fur, feathers or scales drawn with fine texture)",
    extra, NOLABEL, STYLE, COL, CLEAR) };
}
function poses(list, names) {
  return { k: "sheet", r: "po", n: names.join(", "), p: join(
    "A character sticker sheet: 12 poses of the same mascot " + GRID12,
    "The mascot: " + MASCOT, REF, SAME,
    "Poses, in this exact order: " + list.join("; "),
    "Each pose reads clearly at small size, with a few tiny props and colorful confetti strokes where they fit", NOLABEL, STYLE, COL, CLEAR) };
}
// Наклейки с подписью - как «Изучено!» со штампом: маскот, поза и короткое слово на ленте.
// list - [поза, надпись]; надпись повторяется в кавычках, чтобы модель написала её буква в букву.
function captions(list, names, extra) {
  return { k: "sheet", r: "tx", n: names.join(", "), p: join(
    "A sheet of 12 reaction stickers with the same mascot " + GRID12,
    "The mascot: " + MASCOT, REF, SAME,
    "Stickers, in this exact order (pose - caption): " + list.map(function (x) { return x[0] + " - «" + x[1] + "»"; }).join("; "),
    "In every sticker the caption sits on a small curved ribbon banner across the bottom, overlapping the mascot a little, and is part of the die-cut shape; tiny sparkles, hearts and confetti strokes around",
    extra, LETTER, STYLE, COL, CLEAR) };
}
// Ярлыки без маскота: значок и слово - для README, CHANGELOG, постов об обновлении.
function labels(list, names, extra) {
  return { k: "sheet", r: "tx", n: names.join(", "), p: join(
    "A sheet of 12 label stickers " + GRID12,
    "Each label is a wide rounded pill-shaped badge with a small icon on the left and one word on the right",
    "Labels, in this exact order (icon - word): " + list.map(function (x) { return x[0] + " - «" + x[1] + "»"; }).join("; "),
    "Each label has its own accent color from the palette, all the same height", extra, LETTER, STYLE, COL, CLEAR) };
}
// Экраны пустоты и ошибок - листом 4x3: каждая сценка на своей «земле», имена заданы явно.
function empties(list, names) {
  return { k: "sheet", r: "es", n: names.join(", "), p: join(
    "A sticker sheet of 12 small empty-state illustrations for an app " + GRID12 + "; each one is a tiny self-contained scene on its own soft rounded ground shape",
    "Scenes, in this exact order: " + list.join("; "),
    "Gentle calm mood with a little touch of humor; objects are plain things without faces; no words - the app adds its own text", NOLABEL, STYLE, COL, CLEAR) };
}
// Онбординг - лист 3x2: шесть сценок с маскотом, окно режет их сеткой 3x2.
function scenes(list, names) {
  return { k: "sheet", r: "so", n: names.join(", "), p: join(
    "A sticker sheet of 6 small scenes with the same mascot arranged in a neat 3x2 grid with wide even gaps; each scene sits on its own soft rounded ground shape, separate, not touching, the same size",
    "The mascot: " + MASCOT, REF, SAME,
    "Scenes, in this exact order: " + list.join("; "),
    "Cozy and friendly, each scene readable at a glance", NOLABEL, STYLE, COL, CLEAR) };
}
function mascot(x, extra) {
  return { k: "one", r: "ma", n: "mascot-" + slug(x, 3), p: join(
    "A character sticker of " + MASCOT, REF, "Pose: " + x, extra,
    "Full body, centered, with a few small colorful confetti strokes around it", SAME, STYLE, COL, CLEAR) };
}
var DARK = "Anime background art, cinematic wide shot, dramatic volumetric lighting with glowing light sources, rich painterly detail concentrated in the lower third and a calmer, darker upper area that leaves room for text or code on top. Gentle depth haze, small storytelling details worth discovering on a second look, no people";
var LIGHT = "Flat vector landscape illustration, minimalist layered silhouettes with atmospheric perspective, high-key pale washed-out tones, soft morning light, a large calm empty sky. Delicate small details, no people, low contrast overall so dark text placed on top stays easy to read";
var GRAD = "Abstract background for an app, smooth and calm, no objects, a very subtle fine grain, modern ui wallpaper";
function dark(x) {
  return { k: "bg", r: "bd", n: "bg-" + slug(x, 3), p: join(x, DARK, COL, "Highly detailed, polished, high resolution, wallpaper quality") };
}
function light(x) {
  return { k: "bg", r: "bl", n: "bg-" + slug(x, 3), p: join(x, LIGHT, COL, "High resolution") };
}
// Набор из 4 цельных картинок за одну генерацию: сетка 2x2, между картинками пурпурные полосы -
// окно режет по ним (вид ds/ls/gs) и при сохранении увеличивает каждую нейросетью x2.
// list - описания сцен, names - имена файлов (те же, что у поштучных карточек), r - вид, style - манера.
function backs(list, names, r, style) {
  return { k: "sheet", r: r, n: names.join(", "), p: join(
    "Four separate wallpaper illustrations in one image, arranged in a 2x2 grid; each panel is a 3:2 landscape picture",
    "The panels are separated by straight solid pure magenta (#ff00ff) gutter lines about 2% of the image width, with a thin magenta border around the whole image; nothing crosses the gutters, and magenta is never used inside the pictures",
    "Each panel is a complete independent scene with its own composition, edge to edge inside its panel",
    "Panels, in this order (top left, top right, bottom left, bottom right): " + list.map(function (x, i) { return (i + 1) + ") " + x; }).join("; "),
    style, "All four share one art style and palette", COL, "Highly detailed, polished, maximum resolution") };
}
// Логотипы проектов листом 3x2: шесть значков программ за одну генерацию.
function logos(list, names) {
  return { k: "sheet", r: "lg", n: names.join(", "), p: join(
    "A sheet of 6 app icons arranged in a neat 3x2 grid with wide even gaps; each is a separate rounded square tile with a soft inner glow, the same size and style",
    "Icons, in this exact order: " + list.join("; "),
    "One clear central symbol per tile with bold simple shapes, readable even at 16 pixels, soft cel shading and a glossy highlight; no labels under the tiles",
    COL, "Background around the tiles: fully transparent; if impossible, flat solid dark grey #30303a") };
}
function pat(x) {
  return { k: "one", r: "pa", n: "pattern-" + slug(x, 3), p: join("A seamless tileable pattern: " + x,
    "Flat top-down view, motifs evenly distributed with gentle variation in size and rotation, no focal point, subtle low contrast so it works behind text, the edges must tile perfectly", COL) };
}
function grad(x) {
  return { k: "one", r: "gr", n: "gradient-" + slug(x, 3), p: join(x, GRAD, COL) };
}
function medal(m, x) {
  return { k: "one", r: "me", n: "medal-" + slug(m, 2) + "-" + slug(x, 2), p: join(
    "A round achievement medal badge with a polished " + m + " rim decorated with small engraved dots, a " + x + " emblem in the center, a short folded ribbon below",
    "Front view, chunky and satisfying, like a reward in a game", STYLE, COL, CLEAR) };
}
function fx(x) {
  return { k: "one", r: "fx", n: "fx-" + slug(x, 3), p: join("A sprite sheet of 16 different " + x + " arranged in a 4x4 grid, each separate with wide gaps",
    "Soft glow, varied sizes and rotations, crisp shapes, no other objects", COL, "Background: pure flat black #000000") };
}
function frame(x) {
  return { k: "one", r: "fr", n: "frame-" + slug(x, 3), p: join(x, "A game ui asset, front view, flat, symmetrical, clean precise edges, finely crafted ornament", COL, CLEAR) };
}
function logo(x) {
  return { k: "logo", r: "lo", n: "", p: join("An app icon: a rounded square tile with a soft inner glow and " + x,
    "One clear central symbol with bold simple shapes, readable even at 16 pixels, soft cel shading and a glossy highlight, centered, a little margin around the tile", COL,
    "Background around the tile: fully transparent") };
}
// Обложка README: название и строка о проекте - прямо на картинке, рисунок справа.
function cover(x, title, sub) {
  return { k: "cover", r: "co", n: "", p: join("A wide README banner illustration, 2:1",
    "Left half: the title «" + title + "» in large bold clean rounded lettering, and under it a smaller subtitle in Russian «" + sub + "»; both left-aligned with generous margins, on a calm uncluttered area",
    "Right half: " + x,
    "Flat vector style with soft gradients, soft light, small charming details; the text is spelled exactly as in the quotes and nothing else is written", COL) };
}
// Учебная схема для справочника C++: подписи кода - моноширинным шрифтом, буква в букву.
function diagram(x, title) {
  return { k: "one", r: "sh", n: "scheme-" + slug(title, 3), p: join(
    "An educational diagram for a C++ learning app explaining " + x,
    "Clean flat layout on a transparent background: rounded boxes for memory cells and objects, bold arrows, small numbered steps; the mascot appears small in one corner as a friendly guide",
    "All code identifiers are written exactly as given in quotes, in a monospace font; short Russian captions in a clean sans-serif font; no other text, no invented code",
    STYLE, COL, CLEAR) };
}
function raw(name, p, r) { return { k: "one", n: name, p: p, r: r }; }
function as(b, r) { b.r = r; return b; }      // другой раздел библиотеки, чем у конструктора по умолчанию
// Запреты: дописываются строкой «Avoid: ...».
var N = {
  st: "text, letters, labels, numbers, watermark, signature, faces or eyes on objects, drop shadows, ground shadows, background scenery, photorealism, blurry or cut-off edges, thin or double outlines",
  liv: "text, labels, watermark, scary or creepy look, extra eyes or limbs, humans, drop shadows, background scenery, photorealism, cut-off edges",
  ch: "text, watermark, extra limbs, extra eyes, missing arms, teeth, a big mop of hair, scary look, humans, ground shadow, photorealism, any change to the mascot design",
  txt: "misspelled, garbled or invented letters, Latin letters instead of Cyrillic, extra words or captions beyond the given ones, watermark, signature, extra limbs or eyes, a big mop of hair, any change to the mascot design, drop shadows, background scenery, photorealism, cut-off edges, thin or double outlines",
  lab: "misspelled, garbled or invented letters, Latin letters instead of Cyrillic, extra words, watermark, signature, faces on objects, drop shadows, background scenery, photorealism, cut-off edges",
  cov: "misspelled or garbled text, extra words, slogans, watermark, signature, ui screenshots, people, frames, borders, vignette, clutter behind the title",
  logo: "words or extra letters, watermark, signature, tiny unreadable details, photorealism, drop shadows outside the tile",
  dia: "misspelled text, wrong or invented code, extra labels, watermark, photorealism, perspective, clutter, background scenery",
  bg: "text, letters, watermark, people, characters, faces, animals in the foreground, ui elements, frames, borders, vignette, oversaturated colors",
  bgs: "text, letters, watermark, people, characters, faces, animals in the foreground, ui elements, picture frames, vignette, oversaturated colors, magenta inside the pictures, scenes crossing the gutters, unequal panels",
  grads: "text, watermark, people, objects, ui elements, vignette, color banding, magenta inside the pictures, unequal panels",
  grad: "text, watermark, people, objects, ui elements, frames, borders, vignette, color banding",
  pat: "text, watermark, visible seams or tile edges, vignette, a single central object, perspective, lighting gradient",
  fx: "text, watermark, background scenery, frames, gradients in the background"
};
// ---------------- разделы ----------------
// [название, запреты, палитра по умолчанию, [[имя, промпт, пропорции, палитра?, запреты?], ...]]
// Разделы «Про запас: ...» свёрнуты: для игр и экспериментов, проектам пока не нужны.
var S = [
 ["Листы наклеек 4x3", "st", "default", [
  ["Сеть (NetworkDoctor)", sheet(["globe", "wifi router with antennas", "ethernet cable", "broken chain link", "shield with check mark", "satellite dish", "server rack", "signal bars", "plug and socket", "magnet", "tunnel entrance", "first aid kit"]), "3:2", "nord"],

    box.appendChild(b);
  });
  var d = el("button"); d.id = "done"; d.title = "Показать или скрыть то, что уже есть в библиотеке";
  d.onclick = function () { showDone = !showDone; put("prompt-done", showDone ? "1" : ""); drawMain(); };
  box.appendChild(d);
}
function drawMain() {
  var m = document.getElementById("main"), hidden = 0;
  m.innerHTML = "";
  S.forEach(function (sec) {
    var items = sec[3].filter(function (it) { if (!isDone(it, sec)) return true; hidden++; return showDone; });
    if (!items.length) return;
    var spare = sec[0].indexOf("Про запас") === 0, box = m;
    if (spare) {                                   // запасные разделы свёрнуты, открытые - запоминаются
      box = el("details"); box.open = get("open-" + sec[0], "") === "1";
      box.ontoggle = function () { put("open-" + sec[0], box.open ? "1" : ""); };
      var sm = el("summary"); sm.appendChild(el("h2", null, sec[0] + "  (" + items.length + ")")); box.appendChild(sm);
      m.appendChild(box);
    } else m.appendChild(el("h2", null, sec[0]));
    var g = el("div", "grid");
    items.forEach(function (it) {
      var key = palKey(it, sec), t = full(it, sec, key), c = el("div", "c");
      if (isDone(it, sec)) c.className += " done";
      c.appendChild(el("b", null, it[0]));
      c.appendChild(el("div", "meta", it[2] + "   " + palBy[key][1]));
      var p = el("div", "p", text(it, key)); p.title = "Нажмите, чтобы скопировать"; p.onclick = function () { copy(t); }; c.appendChild(p);
      var r = el("div", "row"), b1 = el("button", "b main", "Копировать");
      b1.onclick = function () { copy(t); };
      r.appendChild(b1);
      if (it[1].k === "bg") {                      // фонам можно дописать одну случайную деталь
        var b3 = el("button", "b", "С изюминкой");
        b3.onclick = function () { var w = TW[Math.floor(Math.random() * TW.length)]; copy(t.replace("\nAvoid:", " Add one unexpected small detail: " + w + ".\nAvoid:"), "Добавлено: " + w); };
        r.appendChild(b3);
      }
      var nm = fileName(it, sec), b4 = el("button", "b", "Имена");
      b4.title = "Назвать так файл - окно библиотеки само нарежет и разложит: " + nm + (it[1].k === "sheet" ? String.fromCharCode(10) + "Куски: " + it[1].n : "");
      b4.onclick = function () { copy(nm, "Имена: " + (nm.length > 60 ? nm.slice(0, 60) + "..." : nm)); };
      r.appendChild(b4); c.appendChild(r); g.appendChild(c);
    });
    box.appendChild(g);
  });
  document.getElementById("done").textContent = (showDone ? "Готовые показаны: " : "Готовые скрыты: ") + hidden;
}

// ---------------- что уже сгенерировано ----------------
// Карточка готова, если её файлы есть в библиотеке: при выбранной палитре - в папке с её названием
// (и в папках без палитры, например 03 Маскоты); в режиме «Как задумано» - в папке задуманной палитры.
// Листу хватает двух третей имён: если в нём заменили пару повторов, уже сделанный лист не всплывает снова.
var HAVE = window.HAVE || {}, showDone = get("prompt-done", "") === "1", palName = {};
// Папка палитры названа без знаков, запрещённых в именах файлов: «Ч/б» лежит в «Чб».
function folder(n) { return n.replace(/[\\/:*?"<>|]/g, ""); }
PAL.forEach(function (p) { palName[folder(p[1])] = 1; });
function have(n, pal) {
  for (var d in HAVE) {
    if (d !== pal && palName[d]) continue;
    for (var i = 0; i < HAVE[d].length; i++) if (HAVE[d][i] === n || HAVE[d][i].indexOf(n + "_") === 0) return true;
  }
  return false;
}
function isDone(it, sec) {
  var pal = folder(palBy[palKey(it, sec)][1]), list = it[1].n.split(", "), got = 0;
  list.forEach(function (n) { if (have(n, pal)) got++; });
  return list.length > 1 ? got * 3 >= list.length * 2 : got === 1;
}
drawChips(); drawMain();
