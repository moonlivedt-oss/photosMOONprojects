name: CI

on:
  push:
    branches: [main]
    paths: ["_tools/**", "Prompts.html", "_sources/2026-*/**", ".github/workflows/**"]
  pull_request:
    branches: [main]

jobs:
  # Всё, что проверяет run-tests.cmd, плюс ruff. Только Windows: окно, .cmd и пути рассчитаны на неё.
  # Моделей CLIP на CI нет (225 МБ) - их тесты пропускаются; эталонные листы берутся из _sources.
  check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: _tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Пакеты
        run: python -m pip install pillow numpy PyQt6 onnxruntime ruff
      - name: Линтер
        run: python -m ruff check .
      - name: Тесты
        run: python -m unittest discover -s tests -v
