<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картинки проектов</title>
<style>
  :root {
    --bg: #f4f2f8; --panel: #ffffff; --line: #e3dfec; --text: #1f1d2b; --dim: #6b6780; --accent: #7c4dcc;
    --chip: #ece8f4; --check1: #ffffff; --check2: #e9e6f0; --shadow: 0 1px 3px rgba(30,20,60,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11111b; --panel: #181825; --line: #2a2a3c; --text: #cdd6f4; --dim: #8c8fa6; --accent: #cba6f7;
      --chip: #232336; --check1: #1e1e2e; --check2: #262637; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11111b; --panel: #181825; --line: #2a2a3c; --text: #cdd6f4; --dim: #8c8fa6; --accent: #cba6f7;
    --chip: #232336; --check1: #1e1e2e; --check2: #262637; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 24px 10px; }
  .top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12.5px; }
  .search { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  input[type=search] { width: 260px; max-width: 60vw; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  nav a { text-decoration: none; color: var(--text); background: var(--chip); padding: 3px 10px; border-radius: 12px; font-size: 12.5px; white-space: nowrap; }
  nav a:hover { color: var(--accent); }
  nav a span { color: var(--dim); margin-left: 4px; }
  main { padding: 8px 24px 60px; }
  section { margin-top: 22px; scroll-margin-top: 110px; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  h2 span, h3 span { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  h3 { font-size: 13.5px; font-weight: 600; color: var(--dim); margin: 14px 0 8px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .thumb { position: relative; overflow: hidden; aspect-ratio: 1 / 1; cursor: zoom-in;
    background: repeating-conic-gradient(var(--check1) 0 25%, var(--check2) 0 50%) 0 0 / 16px 16px; }
  .wide .thumb { aspect-ratio: 16 / 10; }
  .thumb img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; }
  .wide .thumb img { inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
  .wide .thumb:hover img { transform: scale(1.03); }
  .cap { padding: 6px 9px 8px; font-size: 12px; min-width: 0; }
  .cap .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .d { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .cap .d button { margin-left: auto; padding: 1px 7px; font-size: 11px; }
  .empty { color: var(--dim); padding: 30px 0; display: none; }
  #box { position: fixed; inset: 0; z-index: 20; background: rgba(8,8,14,.92); display: none; flex-direction: column; }
  #box.on { display: flex; }
  #box .view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px 70px; }
  #box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #box.checker .view { background: repeating-conic-gradient(#2a2a3c 0 25%, #1e1e2e 0 50%) 0 0 / 20px 20px; }
  #box.light .view { background: #f4f2f8; }
  #box .bar { display: flex; gap: 10px; align-items: center; padding: 10px 18px; color: #cdd6f4; font-size: 13px; background: rgba(17,17,27,.9); }
  #box .bar .p { color: #8c8fa6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  #box .bar button { color: #cdd6f4; background: #232336; border-color: #3a3a52; }
  #box .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 26px; width: 48px; height: 64px; border-radius: 10px;
    color: #cdd6f4; background: rgba(35,35,54,.8); border: 1px solid #3a3a52; }
  #box .prev { left: 12px; } #box .next { right: 12px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #11111b; padding: 7px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 30; pointer-events: none; }
  .toast.on { opacity: 1; }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } .search { margin-left: 0; width: 100%; } input[type=search] { flex: 1; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Картинки проектов</h1>
    <div class="meta" id="meta"></div>
    <div class="search">
      <input type="search" id="q" placeholder="Поиск по имени, папке, проекту" autocomplete="off">
      <button id="theme" title="Светлая / тёмная тема">Тема</button>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="empty" id="empty">Ничего не найдено.</div>
<div id="box">
  <div class="view"><img id="big" alt=""></div>
  <button class="nav prev" id="prev" title="Назад (стрелка влево)">&#8249;</button>
  <button class="nav next" id="next" title="Вперёд (стрелка вправо)">&#8250;</button>
  <div class="bar">
    <b id="bname"></b><span class="p" id="bpath"></span>
    <button id="bbg" title="Фон под прозрачными картинками">Фон</button>
    <button id="bcopy">Скопировать путь</button>
    <button id="bclose">Закрыть</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var DATA = /*__DATA__*/null;
var WIDE = /^(01|02|07)/;   // разделы с фотографиями — крупные превью
var flat = [], shown = [];

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(t) { var x = document.getElementById("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove("on"); }, 1400); }
function copy(text) {
  function fallback() { var a = el("textarea"); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); toast("Путь скопирован"); } catch (e) { prompt("Путь к оригиналу:", text); } a.remove(); }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast("Путь скопирован"); }, fallback); else fallback();
}
function encode(p) { return p.split("/").map(encodeURIComponent).join("/"); }

function build() {
  document.getElementById("meta").textContent = DATA.total + " картинок · обновлено " + DATA.built;
  var nav = document.getElementById("nav"), main = document.getElementById("main");
  DATA.sections.forEach(function (s, si) {
    var count = 0; s.groups.forEach(function (g) { count += g.items.length; });
    var id = "s" + si;
    var a = el("a", null, s.name); a.href = "#" + id; a.appendChild(el("span", null, count)); nav.appendChild(a);
    var sec = el("section"); sec.id = id; sec.dataset.name = s.name;
    var h = el("h2", null, s.name); h.appendChild(el("span", null, count)); sec.appendChild(h);
    s.groups.forEach(function (g) {
      var wrap = el("div", "group");
      if (g.name) { var h3 = el("h3", null, g.name); h3.appendChild(el("span", null, g.items.length)); wrap.appendChild(h3); }
      var grid = el("div", "grid" + (WIDE.test(s.name) ? " wide" : ""));
      g.items.forEach(function (it) {
        it.key = (s.name + " " + g.name + " " + it.name + " " + it.src).toLowerCase();
        var card = el("div", "card");
        var th = el("div", "thumb"), img = el("img"); img.loading = "lazy"; img.alt = it.name; img.src = encode(it.file);
        img.onload = function () { if (img.naturalWidth) dim.textContent = img.naturalWidth + "×" + img.naturalHeight + " · " + it.size; };
        th.appendChild(img);
        th.onclick = function () { open(it); };
        var cap = el("div", "cap"), n = el("div", "n", it.name); n.title = it.src;
        var d = el("div", "d"), dim = el("span", null, it.size), b = el("button", null, "путь");
        b.title = "Скопировать путь к оригиналу: " + it.src;
        b.onclick = function () { copy(it.src); };
        d.appendChild(dim); d.appendChild(b); cap.appendChild(n); cap.appendChild(d);
        card.appendChild(th); card.appendChild(cap); grid.appendChild(card);
        it.card = card; it.group = wrap; it.sec = sec;
        flat.push(it);
      });
      wrap.appendChild(grid); sec.appendChild(wrap);
    });
    main.appendChild(sec);
  });
  shown = flat.slice();
}

function filter() {
  var q = document.getElementById("q").value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
  shown = [];
  flat.forEach(function (it) {
    var ok = words.every(function (w) { return it.key.indexOf(w) >= 0; });
    it.card.style.display = ok ? "" : "none";
    if (ok) shown.push(it);
  });
  document.querySelectorAll(".group").forEach(function (g) { g.style.display = g.querySelector('.card:not([style*="none"])') ? "" : "none"; });
  document.querySelectorAll("section").forEach(function (s) { s.style.display = s.querySelector('.card:not([style*="none"])') ? "" : "none"; });
  document.getElementById("empty").style.display = shown.length ? "none" : "block";
}

var cur = -1, bgMode = 0, BG = ["", "checker", "light"];
function open(it) { cur = shown.indexOf(it); show(); document.getElementById("box").classList.add("on"); }
function show() {
  var it = shown[cur]; if (!it) return;
  document.getElementById("big").src = encode(it.file);
  document.getElementById("bname").textContent = it.name + "  (" + (cur + 1) + " из " + shown.length + ")";
  document.getElementById("bpath").textContent = it.src;
}
function step(d) { if (!shown.length) return; cur = (cur + d + shown.length) % shown.length; show(); }
function close() { document.getElementById("box").classList.remove("on"); }

build();
document.getElementById("q").addEventListener("input", filter);
document.getElementById("prev").onclick = function () { step(-1); };
document.getElementById("next").onclick = function () { step(1); };
document.getElementById("bclose").onclick = close;
document.getElementById("bcopy").onclick = function () { copy(shown[cur].src); };
document.getElementById("bbg").onclick = function () {
  var b = document.getElementById("box");
  BG.forEach(function (c) { if (c) b.classList.remove(c); });
  bgMode = (bgMode + 1) % BG.length;
  if (BG[bgMode]) b.classList.add(BG[bgMode]);
};
document.getElementById("box").addEventListener("click", function (e) { if (e.target.classList.contains("view")) close(); });
document.addEventListener("keydown", function (e) {
  if (!document.getElementById("box").classList.contains("on")) { if (e.key === "/" && document.activeElement.id !== "q") { e.preventDefault(); document.getElementById("q").focus(); } return; }
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
(function () {
  var saved = null; try { saved = localStorage.getItem("gallery-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById("theme").onclick = function () {
    var dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("gallery-theme", next); } catch (e) {}
  };
})();
</script>
</body>
</html>
