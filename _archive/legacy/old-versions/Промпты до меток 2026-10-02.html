<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Промпты для картинок</title>
<style>
:root{--bg:#15151c;--card:#1f1f29;--card2:#272734;--fg:#e8e6f0;--dim:#9a98a8;--acc:#9d8cff;--line:#2f2f3d;--ok:#5fd39a}
@media (prefers-color-scheme:light){:root{--bg:#f4f3f8;--card:#fff;--card2:#f0eef7;--fg:#1d1c24;--dim:#6b6978;--acc:#6a55e0;--line:#e2e0ea;--ok:#1f9d63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.pals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:12px}
.pal.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sw{display:flex;border-radius:10px;overflow:hidden;height:16px}.sw i{width:8px;display:block}
#done{margin-left:auto;background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 6px}
#done:hover{color:var(--fg)}
main{padding:2px 16px 40px;max-width:1400px}
h2{font-size:15px;margin:20px 0 8px;color:var(--dim);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.c b{font-size:14px}
.meta{color:var(--dim);font-size:12px}
.p{background:var(--card2);border-radius:7px;padding:7px 9px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:9.5em;overflow:auto;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap}
.c.done{opacity:.55}.c.done b:after{content:"  - готово";color:var(--ok);font-weight:400}
button.b{flex:1;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer;font-size:12px}
button.b.main{flex:2;background:var(--acc);border-color:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="pals" id="pals"></div></header>
<main id="main"></main>
<div id="toast"></div>

function slug(s, n) {

  return w.slice(0, n || 3).join("-");
}

function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
var cur = get("prompt-pal", "auto"), palBy = {};
PAL.forEach(function (p) { palBy[p[0]] = p; });
if (!palBy[cur]) cur = "auto";
// Логотипы и обложки названы по проекту: logo-networkdoctor, cover-moon-bundle.
S.forEach(function (sec) { sec[3].forEach(function (it) { if (!it[1].n) it[1].n = it[1].k + "-" + slug(it[0], 3); }); });

function palKey(it, sec) { return cur === "auto" ? (it[3] || sec[2]) : cur; }
function text(it, pal) { return it[1].p.replace("{P}", palBy[pal][2]); }
function full(it, sec, pal) { return text(it, pal) + "\nAvoid: " + N[it[4] || sec[1]] + "."; }
function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.className = "on"; clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ""; }, 1800); }
function copy(s, msg) {
  function done() { toast(msg || "Скопировано"); }
  function fb() { var a = document.createElement("textarea"); a.value = s; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); done(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(done, fb); else fb();
}
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function drawChips() {
  var box = document.getElementById("pals"); box.innerHTML = "";
  PAL.forEach(function (p) {
    var b = el("button", "pal" + (p[0] === cur ? " on" : ""));
    if (p[3].length) { var sw = el("span", "sw"); p[3].forEach(function (c) { var i = el("i"); i.style.background = c; sw.appendChild(i); }); b.appendChild(sw); }
    b.appendChild(el("span", null, p[1]));
    b.onclick = function () { cur = p[0]; put("prompt-pal", cur); drawChips(); drawMain(); };
    box.appendChild(b);
  });
  var d = el("button"); d.id = "done"; d.title = "Показать или скрыть то, что уже есть в библиотеке";
  d.onclick = function () { showDone = !showDone; put("prompt-done", showDone ? "1" : ""); drawMain(); };
  box.appendChild(d);
}
function drawMain() {
  var m = document.getElementById("main"), hidden = 0;
  m.innerHTML = "";
  S.forEach(function (sec) {
    var items = sec[3].filter(function (it) { if (!isDone(it, sec)) return true; hidden++; return showDone; });
    if (!items.length) return;
    m.appendChild(el("h2", null, sec[0]));
    var g = el("div", "grid");
    items.forEach(function (it) {
      var key = palKey(it, sec), t = full(it, sec, key), c = el("div", "c");
      if (isDone(it, sec)) c.className += " done";
      c.appendChild(el("b", null, it[0]));
      c.appendChild(el("div", "meta", it[2] + "   " + palBy[key][1]));
      var p = el("div", "p", text(it, key)); p.title = "Нажмите, чтобы скопировать"; p.onclick = function () { copy(t); }; c.appendChild(p);
      var r = el("div", "row"), b1 = el("button", "b main", "Копировать");
      b1.onclick = function () { copy(t); };
      r.appendChild(b1);
      if (it[1].k === "bg") {                      // фонам можно дописать одну случайную деталь
        var b3 = el("button", "b", "С изюминкой");
        b3.onclick = function () { var w = TW[Math.floor(Math.random() * TW.length)]; copy(t.replace("\nAvoid:", " Add one unexpected small detail: " + w + ".\nAvoid:"), "Добавлено: " + w); };
        r.appendChild(b3);
      }
      var nm = it[1].n, b4 = el("button", "b", "Имена");
      b4.title = nm; b4.onclick = function () { copy(nm, "Имена: " + (nm.length > 60 ? nm.slice(0, 60) + "..." : nm)); };
      r.appendChild(b4); c.appendChild(r); g.appendChild(c);
    });
    m.appendChild(g);
  });
  document.getElementById("done").textContent = (showDone ? "Готовые показаны: " : "Готовые скрыты: ") + hidden;
}

// Карточка готова, если её файлы есть в библиотеке: при выбранной палитре - в папке с её названием
// (и в папках без палитры, например 03 Маскоты); в режиме «Как задумано» - в папке задуманной палитры.
// Листу хватает двух третей имён: если в нём заменили пару повторов, уже сделанный лист не всплывает снова.
var HAVE = window.HAVE || {}, showDone = get("prompt-done", "") === "1", palName = {};
PAL.forEach(function (p) { palName[p[1]] = 1; });
function have(n, pal) {
  for (var d in HAVE) {
    if (d !== pal && palName[d]) continue;
    for (var i = 0; i < HAVE[d].length; i++) if (HAVE[d][i] === n || HAVE[d][i].indexOf(n + "_") === 0) return true;
  }
  return false;
}
function isDone(it, sec) {
  var pal = palBy[palKey(it, sec)][1], list = it[1].n.split(", "), got = 0;
  list.forEach(function (n) { if (have(n, pal)) got++; });
  return list.length > 1 ? got * 3 >= list.length * 2 : got === 1;
}
drawChips(); drawMain();
</script>
